[project]
name = "na-imputation"
version = "0.1.0"
description = "NA-profile classification and class-specific imputation for LFQ proteomics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
